<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradient (Cyan / Electric Violet / Amber) -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;200%;100%" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Glowing Lines Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Sphere / Vector Node Gradient -->
    <radialGradient id="sphereGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#082f49" />
    </radialGradient>

    <radialGradient id="quantGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      letter-spacing: -0.5px;
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
    }
    .desc-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 18px;
      fill: #94a3b8;
      font-weight: 400;
    }
    .feature-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      fill: #cbd5e1;
    }
    .grid-line {
      stroke: #334155;
      stroke-opacity: 0.25;
      stroke-width: 1;
    }
    .radar-pulse {
      animation: radar 4s ease-out infinite;
      transform-origin: 970px 180px;
    }
    @keyframes radar {
      0% { r: 20px; opacity: 0.8; stroke-width: 2px; }
      100% { r: 140px; opacity: 0; stroke-width: 0.5px; }
    }
    .floating-dot {
      animation: float 6s ease-in-out infinite alternate;
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
  </style>

  <!-- Base Card Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Technical Grid Background -->
  <g class="grid-line">
    <line x1="60" y1="0" x2="60" y2="360" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="260" y1="0" x2="260" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="460" y1="0" x2="460" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="660" y1="0" x2="660" y2="360" />
    <line x1="760" y1="0" x2="760" y2="360" />
    <line x1="860" y1="0" x2="860" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1060" y1="0" x2="1060" y2="360" />
    <line x1="1160" y1="0" x2="1160" y2="360" />
    
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="80" r="180" fill="url(#quantGlow)" filter="url(#glow)" opacity="0.4" />
  <circle cx="970" cy="180" r="220" fill="url(#quantGlow)" filter="url(#glow)" opacity="0.35" />

  <!-- Animated Vector / Quantization Sphere Diagram (Right side) -->
  <g transform="translate(970, 180)">
    <!-- Expanding Quantization Wave -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#38bdf8" class="radar-pulse" />
    <circle cx="0" cy="0" r="30" fill="none" stroke="#c084fc" class="radar-pulse" style="animation-delay: 2s;" />

    <!-- Unit Hypersphere Wireframe -->
    <ellipse cx="0" cy="0" rx="125" ry="125" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" />
    <ellipse cx="0" cy="0" rx="125" ry="45" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    <ellipse cx="0" cy="0" rx="45" ry="125" fill="none" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5" />

    <!-- Dynamic Rotating Matrix/Basis Vectors -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite" />
      <!-- High-dimensional vector projection axes -->
      <line x1="-110" y1="0" x2="110" y2="0" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.7" />
      <line x1="0" y1="-110" x2="0" y2="110" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.7" />
      <line x1="-80" y1="-80" x2="80" y2="80" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="3,3" />
      
      <!-- Coordinate Points on Sphere -->
      <circle cx="110" cy="0" r="5" fill="#38bdf8" filter="url(#subtleGlow)" />
      <circle cx="-110" cy="0" r="4" fill="#38bdf8" />
      <circle cx="0" cy="110" r="5" fill="#c084fc" filter="url(#subtleGlow)" />
      <circle cx="0" cy="-110" r="4" fill="#c084fc" />
      <circle cx="80" cy="80" r="4.5" fill="#818cf8" />
      <circle cx="-80" cy="-80" r="4.5" fill="#818cf8" />
    </g>

    <!-- Orbiting Lloyd-Max Quantized Cluster -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite" />
      <circle cx="70" cy="-55" r="7" fill="#f43f5e" filter="url(#subtleGlow)">
        <animate attributeName="r" values="6;8;6" dur="3s" repeatCount="indefinite" />
      </circle>
      <line x1="0" y1="0" x2="70" y2="-55" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="2,2" stroke-opacity="0.8" />
      
      <circle cx="-60" cy="65" r="6" fill="#10b981" filter="url(#subtleGlow)" />
      <line x1="0" y1="0" x2="-60" y2="65" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2" stroke-opacity="0.8" />
    </g>

    <!-- Center Quantization Core -->
    <circle cx="0" cy="0" r="18" fill="url(#sphereGrad)" filter="url(#subtleGlow)" />
    <circle cx="0" cy="0" r="8" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Left Content Area -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="210" height="28" rx="14" fill="#0369a1" fill-opacity="0.2" stroke="#0284c7" stroke-opacity="0.5" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="19" class="badge-text">VECTOR QUANTIZATION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" class="title" fill="url(#titleGrad)" filter="url(#subtleGlow)">pyturboquant-cpu</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="170" class="desc-text">
      Ultra-fast, near-optimal vector quantization with zero training data.
    </text>
    <text x="0" y="196" class="desc-text" fill="#64748b" style="font-size: 15px;">
      CPU implementation of TurboQuant (ICLR 2026) • High-throughput SIMD / NumPy
    </text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 235)">
      <!-- Badge 1: Data-Oblivious -->
      <g transform="translate(0, 0)">
        <rect width="145" height="38" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <path d="M16 19 L22 13 L28 19 L22 25 Z" fill="#38bdf8" />
        <text x="36" y="24" class="feature-text">Data-Oblivious</text>
      </g>

      <!-- Badge 2: MSE & Unbiased IP -->
      <g transform="translate(160, 0)">
        <rect width="180" height="38" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <circle cx="24" cy="19" r="5" fill="#818cf8" />
        <text x="38" y="24" class="feature-text">MSE &amp; Unbiased IP</text>
      </g>

      <!-- Badge 3: 1-8 bit support -->
      <g transform="translate(355, 0)">
        <rect width="150" height="38" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <path d="M16 15 H28 M16 19 H25 M16 23 H28" stroke="#c084fc" stroke-width="2" stroke-linecap="round" />
        <text x="36" y="24" class="feature-text">1-8 Bit Codes</text>
      </g>

      <!-- Badge 4: Near-Optimal Distortion -->
      <g transform="translate(520, 0)">
        <rect width="185" height="38" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <polygon points="20,13 25,24 15,24" fill="#34d399" />
        <text x="34" y="24" class="feature-text">Near-Optimal Bound</text>
      </g>
    </g>

    <!-- Bottom Accent Laser Line -->
    <g transform="translate(0, 305)">
      <line x1="0" y1="0" x2="650" y2="0" stroke="url(#lineGrad)" stroke-width="2" />
      <circle cx="325" cy="0" r="3" fill="#38bdf8">
        <animate attributeName="cx" values="20;630;20" dur="5s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>
</svg>
