[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyturboquant-cpu"
version = "0.1.0"
description = "CPU implementation of TurboQuant data-oblivious vector quantization (arXiv:2504.19874)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    {name = "Ishan Dutta", email="ishandutta2007@gmail.com" },
]
keywords = [
    "vector-quantization",
    "kv-cache",
    "llm",
    "compression",
    "turboquant",
    "quantization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/ishandutta2007/pyturboquant-cpu"
Documentation = "https://github.com/ishandutta2007/pyturboquant-cpu#readme"
Repository = "https://github.com/ishandutta2007/pyturboquant-cpu"
Issues = "https://github.com/ishandutta2007/pyturboquant-cpu/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
